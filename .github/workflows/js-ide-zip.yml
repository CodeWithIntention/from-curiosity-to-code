name: Build js-ide zip

on:
  push:
    paths:
      - '.github/workflows/js-ide-zip.yml'
      - 'docs/js-ide/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p docs/downloads
          cd docs
          rm -f downloads/js-ide.zip
          zip -r downloads/js-ide.zip js-ide \
            -x "js-ide/.git/*" \
            -x "js-ide/**/.DS_Store"

      - name: Commit updated zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/downloads/js-ide.zip

          if ! git diff --cached --quiet; then
            msg=$(git log -1 --pretty=%s --no-merges)
            if [ -z "$msg" ]; then
              msg=$(git log -1 --pretty=%s)
            fi
            git commit -m "zip: ${msg}"
            git push
          else
            echo "No changes to commit"
          fi
