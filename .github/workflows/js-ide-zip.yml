name: Build js-ide zip

on:
  push:
    paths:
      - '.github/workflows/js-ide-zip.yml'
      - 'docs/js-ide/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build zip
        run: |
          mkdir -p docs/downloads
          cd docs
          rm -f downloads/js-ide.zip
          zip -r downloads/js-ide.zip js-ide \
            -x "js-ide/.git/*" \
            -x "js-ide/**/.DS_Store"

      - name: Commit updated zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/js-ide.zip
          git diff --cached --quiet || git commit -m "Update js-ide.zip"
          git push
