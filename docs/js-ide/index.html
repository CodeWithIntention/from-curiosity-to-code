<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Curiosity to Code -- JavaScript IDE</title>
  <link rel="stylesheet" href="assets/css/js-css.css" />
</head>
<body onload="onAppLoad()">
  <header class="app-header">
    <div>
      <div class="app-title">From Curiosity to Code</div>
      <div class="app-subtitle">JavaScript IDE v1.0 <span id="releaseDate"></span>
        <a href="../downloads/js-ide.zip" id="download-link" title="Download the Zip file to run the IDE on your computer." hidden>
          Download
        </a>
      </div>
    </div>
    <nav class="app-nav">
      <a href="js-help.html">Help</a>
      <a href="mailto:codewithintention@gmail.com?subject=JavaScript IDE - Bug Report&body=Hi, my name is YOUR_NAME. I encountered a bug with the JavaScript IDE.%0A%0ADescribe what happened:%0A%0ASteps to reproduce:%0A%0AExpected result:%0A">
        Report a bug
      </a>
      <a href="mailto:codewithintention@gmail.com?subject=JavaScript IDE - General Inquiry&body=Hi, my name is YOUR_NAME. I have a question about the JavaScript IDE.%0A%0AThank you!">
        Contact Us
      </a>
      <a href="samples/index.html">
        Play Games
      </a>
    </nav>
  </header>

  <main id="workspace" class="workspace">
    <section id="editorHost" class="frame-pane editor-host">
      <iframe
        id="editorFrame"
        class="host-frame"
        src="js-editor.html"
        title="Editor"
      ></iframe>
    </section>

    <div id="resizer" class="resizer" aria-hidden="true"></div>

    <section id="shellHost" class="frame-pane shell-host">
      <iframe
        id="shellFrame"
        class="host-frame"
        src="js-shell.html"
        title="Shell"
      ></iframe>
    </section>
  </main>

  <script src="js-lib.js"></script>
  <script src="js-index.js"></script>
  <script src="js-release.js"></script>
  <script>
    function onAppLoad() {
      const downloadLink = document.getElementById("download-link");
      const releaseDate = document.getElementById("releaseDate");
      if (releaseDate) {
        releaseDate.textContent = `- ${RELEASE_DATE}`;
      }
      if (!window.location.href.startsWith("file://") && downloadLink) {
        downloadLink.hidden = false;
      }
    }
  </script>
</body>
</html>
