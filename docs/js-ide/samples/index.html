<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Curiosity to Code -- Samples</title>
  <link rel="stylesheet" href="../assets/css/js-css.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <div class="app-title">From Curiosity to Code</div>
      <div class="app-subtitle">Sample Game Programs</div>
    </div>
    <nav class="app-nav">
      <a href="javascript:loadGame('tic-tac-toe')">Tic-Tac-Toe</a>
      <a href="javascript:loadGame('mine-sweeper')">Mine Sweeper</a>
      <a href="javascript:loadGame('reversi')">Reversi</a>
    </nav>
    <nav class="app-nav">
      <a href="https://codewithintention.github.io/from-curiosity-to-code/">Home</a>
      <a href="mailto:codewithintention@gmail.com?subject=JavaScript IDE - Bug Report&body=Hi, my name is YOUR_NAME. I encountered a bug with the JavaScript IDE.%0A%0ADescribe what happened:%0A%0ASteps to reproduce:%0A%0AExpected result:%0A">
        Report a bug
      </a>
      <a href="mailto:codewithintention@gmail.com?subject=JavaScript IDE - General Inquiry&body=Hi, my name is YOUR_NAME. I have a question about the JavaScript IDE.%0A%0AThank you!">
        Contact Us
      </a>
    </nav>
  </header>

  <main id="workspace" class="workspace">
    <iframe
        id="gameFrame"
        class="host-frame"
        src="about:blank"
        >
    </iframe>
    </section>
  </main>
  <script>
    loadGame('reversi');

    function loadGame(game) {
        const oldFrame = document.getElementById("gameFrame");
        if (oldFrame.title === game) return;

        const newFrame = oldFrame.cloneNode(false);
        oldFrame.parentNode.replaceChild(newFrame, oldFrame);

        newFrame.title = game;
        newFrame.contentWindow.open = () => {return newFrame.contentWindow;}

        const script = newFrame.contentDocument.createElement("script");
        script.src = `${game}.js`;
        newFrame.contentDocument.body.appendChild(script);
    } 
  </script>
</body>
</html>
